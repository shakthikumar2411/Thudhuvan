services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: thudhuvan, POSTGRES_PASSWORD: thudhuvan, POSTGRES_DB: thudhuvan}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    env_file: .env
    environment: {DATABASE_URL: "postgres://thudhuvan:thudhuvan@db:5432/thudhuvan"}
    ports: ["3000:3000"]
    depends_on: [db]
volumes: {pgdata: {}}
